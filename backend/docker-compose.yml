services:
  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: flex-qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - ../storage/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: flex-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: flex
      POSTGRES_PASSWORD: flex
      POSTGRES_DB: flex
    volumes:
      - ../storage/postgres:/var/lib/postgresql/data
    restart: unless-stopped
