# Startup founder persona fixture based on the Felix startup journal.
# Felix: developer tool startup for landing pages/templates.
# Team: Devon (backend), Priya (backend), Jake (design), Leo (backend),
#        Emily (marketing), Sarah (finance), Maria (new hire from Stripe).
# Context: approaching beta launch, 12K waitlist, office in Bangalore.

todos:
  # ── Engineering (t1–t30) ──────────────────────────────────────────────
  - id: "t1"
    title: "Complete API migration from REST to GraphQL"
    description: "Convert legacy REST endpoints to new GraphQL layer, currently about 60% through"
    status: "in_progress"
    tags: ["api", "graphql", "migration", "rest", "backend"]
  - id: "t2"
    title: "Fix auth middleware token refresh edge cases"
    description: "Lots of edge cases around token refresh not anticipated during API migration"
    status: "in_progress"
    tags: ["auth", "middleware", "token-refresh", "api", "security"]
  - id: "t3"
    title: "Implement rate limiter for public API"
    description: ""
    status: "pending"
    tags: ["rate-limiting", "api", "backend", "security"]
  - id: "t4"
    title: "Write integration tests for API endpoints"
    description: "Cover all critical flows including signup, project creation, and publishing"
    status: "in_progress"
    tags: ["testing", "api", "integration-tests", "qa"]
  - id: "t5"
    title: "Refactor notification service with event bus pattern"
    description: "Replace current implementation with proper event bus for easier notification channel additions"
    status: "in_progress"
    tags: ["notification", "refactor", "event-bus", "backend"]
  - id: "t6"
    title: "Optimize database connection pooling configuration"
    description: "Switch PgBouncer from session mode to transaction mode for workload efficiency"
    status: "completed"
    tags: ["database", "pgbouncer", "performance", "postgresql"]
  - id: "t7"
    title: "Set up Redis caching for waitlist endpoint"
    description: "60-second TTL to bring P99 latency back under 200ms"
    status: "completed"
    tags: ["redis", "caching", "waitlist", "performance"]
  - id: "t8"
    title: "Fix webhook retry logic with backoff strategy"
    description: "Redis connection pool exhaustion under high load causing retry workers to spin up too fast"
    status: "in_progress"
    tags: ["webhook", "redis", "retry", "backend"]
  - id: "t9"
    title: "Fix memory leak in PDF generation service"
    description: "Memory leak when processing large documents, adding to sprint backlog"
    status: "cancelled"
    tags: ["pdf", "memory-leak", "bug", "backend"]
  - id: "t10"
    title: "Parallelize CI integration test suite"
    description: "Pipeline takes 45 minutes, most time is in integration test suite"
    status: "pending"
    tags: ["ci", "testing", "devops", "performance"]
  - id: "t11"
    title: "Add structured logging with correlation IDs"
    description: "Cross-service debugging currently like piecing together a puzzle without all pieces"
    status: "in_progress"
    tags: ["logging", "observability", "correlation-id", "backend"]
  - id: "t12"
    title: "Implement distributed tracing with OpenTelemetry"
    description: "Background task building on structured logging spike, using Jaeger UI"
    status: "in_progress"
    tags: ["opentelemetry", "tracing", "observability", "jaeger"]
  - id: "t13"
    title: "Set up automated SSL certificate renewal"
