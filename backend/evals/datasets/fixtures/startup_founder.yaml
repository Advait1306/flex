    status: "completed"
    tags: ["ssl", "certificate", "devops", "automation"]
  - id: "t14"
    title: "Fix cursor position bug in collaboration module"
    description: "Editor loses cursor position when teammate joins in real-time, re-renders entire state"
    status: "completed"
    tags: ["collaboration", "editor", "cursor", "bug", "frontend"]
  - id: "t15"
    title: "Standardize API error response format"
    description: "Some endpoints return detailed field-level errors, others return generic messages"
    status: "pending"
    tags: ["api", "error-handling", "standards", "backend"]
  - id: "t16"
    title: "Add idempotency keys to all queue consumers"
    description: "Email duplication bug revealed three other queue consumers with same vulnerability"
    status: "in_progress"
    tags: ["queue", "idempotency", "reliability", "backend"]
  - id: "t17"
    title: "Fix email deduplication race condition in queue"
    description: "Duplicate welcome emails sent to waitlist signup batch"
    status: "completed"
    tags: ["email", "race-condition", "bug", "queue"]
  - id: "t18"
    title: "Set up Sentry error monitoring and alerts"
    description: "Currently averaging 30 unhandled exceptions per day, mostly in PDF service"
    status: "completed"
    tags: ["sentry", "monitoring", "error-tracking", "observability"]
  - id: "t19"
    title: "Configure blue-green deployment pipeline"
    description: "Health checks and automatic rollback on failing health check verified in staging"
    status: "completed"
    tags: ["deployment", "blue-green", "devops", "ci"]
  - id: "t20"
    title: "Add connection pool monitoring through PgBouncer"
    description: "Part of database monitoring setup with pg_stat_statements and slow query alerts"
    status: "completed"
    tags: ["pgbouncer", "monitoring", "database", "observability"]
  - id: "t21"
